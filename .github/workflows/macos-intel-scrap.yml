name: macOS Intel Scrap Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'libs/scrap/**'

env:
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  build:
    name: x86_64-apple-darwin (scrap)
    runs-on: macos-14
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Homebrew dependencies
      run: |
        brew install python3 nasm cmake wget

    - name: Setup vcpkg
      run: |
        mkdir -p "$GITHUB_WORKSPACE/vcpkg"
        cd "$GITHUB_WORKSPACE/vcpkg"
        git clone https://github.com/microsoft/vcpkg.git .
        git checkout $VCPKG_COMMIT_ID
        ./bootstrap-vcpkg.sh -disableMetrics

    - name: Install vcpkg dependencies
      run: |
        $GITHUB_WORKSPACE/vcpkg/vcpkg install libyuv --triplet x64-osx-release

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: stable
        targets: x86_64-apple-darwin

    - name: Build scrap library
      run: |
        export VCPKG_ROOT="$GITHUB_WORKSPACE/vcpkg"
        export VCPKG_INSTALLED_ROOT="$VCPKG_ROOT/installed"
        cargo build -p scrap --target x86_64-apple-darwin