# Publish a build artifact from a completed run to a fork release.
#
# Parameterized rewrite of the original publish-builds.yml: the run id, the
# release tag and the asset name are now workflow_dispatch inputs, so the same
# workflow serves every future build without source changes.
#
# Runs entirely inside the Actions network: download-artifact pulls from the
# completed run, action-gh-release uploads straight to the release - nothing
# is downloaded or uploaded from a local machine.

name: Publish builds to Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Actions run id owning the artifact'
        required: true
      tag:
        description: 'Release tag to publish to'
        required: true
      artifact_name:
        description: 'Artifact name inside the run'
        required: true
      asset_name:
        description: 'Final release asset file name (with extension)'
        required: true

env:
  APPEND_BODY: |
    ### Build from run ${{ github.event.inputs.run_id }}

    - Artifact `${{ github.event.inputs.artifact_name }}` published to release tag \
    `${{ github.event.inputs.tag }}` as `${{ github.event.inputs.asset_name }}`.
    - Build flags and source combination are described on the run page; this \
    entry records the release linkage only.

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download artifact (Actions network)
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: ./dist
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show downloaded files
        run: |
          ls -laR ./dist/
          file ./dist/* || true

      - name: Rename to final asset name
        run: |
          mkdir -p ./out
          mv ./dist/* "./out/${{ github.event.inputs.asset_name }}"
          ls -la ./out/

      - name: Append to release and upload
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: ./out/*
          append_body: true
          body: ${{ env.APPEND_BODY }}